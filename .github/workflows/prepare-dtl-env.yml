name: Prepare test environment
permissions:
  id-token: write
on:
  repository_dispatch:
    types:
      - start-workflow-run-tests
  workflow_dispatch:
    inputs:
      sharepoint_versions:
        description: 'SharePoint versions to deploy'
        required: true
        default: '["SE"]'
      skip_create_environment:
        description: 'Set to true to skip deployment of template and jump to artifacts installation'
        required: true
        type: boolean
        default: false

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sharepoint-versions: ${{ steps.validate.outputs.sharepoint-versions }}
      skip-create-environment: ${{ steps.validate.outputs.skip-create-environment }}
    steps:
    - name: Validate and normalize dispatch inputs
      id: validate
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        DISPATCH_INPUTS: ${{ toJSON(inputs) }}
        CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
      run: |
        set -euo pipefail
        if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
          values="$CLIENT_PAYLOAD"
        else
          values="$DISPATCH_INPUTS"
        fi
        normalized=$(jq -ce '
          if type != "object" then error("Dispatch inputs must be an object") else . end
          | {
              sharepoint_versions: (if has("sharepoint_versions") then .sharepoint_versions else "[\"SE\"]" end),
              skip_create_environment: (if has("skip_create_environment") then .skip_create_environment else false end)
            }
          | if (.skip_create_environment | type) != "boolean"
            then error("skip_create_environment must be a boolean") else . end
          | .sharepoint_versions |= (if type == "string" then fromjson else . end)
          | if (.sharepoint_versions | type) != "array"
            then error("sharepoint_versions must be a JSON array") else . end
          | if (.sharepoint_versions | length) == 0 or
               (all(.sharepoint_versions[]; . == "SE" or . == "2019" or . == "2016") | not) or
               ((.sharepoint_versions | unique | length) != (.sharepoint_versions | length))
            then error("sharepoint_versions must contain unique supported versions: SE, 2019, 2016")
            else . end
        ' <<< "$values")
        echo "sharepoint-versions=$(jq -c '.sharepoint_versions' <<< "$normalized")" >> "$GITHUB_OUTPUT"
        echo "skip-create-environment=$(jq -r '.skip_create_environment' <<< "$normalized")" >> "$GITHUB_OUTPUT"

  call-workflow-prepare-dtl-env:
    needs: validate-inputs
    uses: ./.github/workflows/reusable-prepare-dtl-env.yml
    with:
      project-name: ${{ vars.PROJECT_NAME }}
      sharepoint-versions: ${{ needs.validate-inputs.outputs.sharepoint-versions }}
      skip-create-environment: ${{ fromJSON(needs.validate-inputs.outputs.skip-create-environment) }}
      dtl-serviceName: ${{ vars.dtl_serviceName }}
      dtl-rgName: ${{ vars.dtl_rgName }}
      dtl-environmentName: ${{ vars.dtl_environmentName }}
      dtl-subscriptionId: ${{ vars.dtl_subscriptionId }}
      azdevops-organizationName: ${{ vars.DTL_AZDEVOPSACCOUNT }}
      dtl-env-adminUserName: ${{ vars.dtl_adminUserName }}
      dtl-env-addPublicIPAddress: ${{ vars.dtl_addPublicIPAddress }}
      dtl-env-rdpTrafficAllowed: ${{ vars.dtl_RDPTrafficAllowed }}
      dtl-env-addAzureBastion: ${{ vars.dtl_addAzureBastion == 'true' }}
      test-prepareSharePointVmScriptUris: ${{ vars.DTL_PrepareSharePointVmScriptUris }}
      test-claimsProviderPackageUri: ${{ vars.DTL_ClaimsProviderPackageUri }}
      unittestfiles_azure_storage_share_relative_path: ${{ vars.unittestfiles_azure_storage_share_relative_path }}
      test-registerRunner: ${{ vars.DTL_REGISTER_RUNNER == 'true' }}
      test_registerRunner_scriptUrl: ${{ vars.DTL_REGISTER_RUNNER_SCRIPT_URL }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ADO_PAT_REGISTERAGENT: ${{ secrets.ADO_PAT_REGISTERAGENT }}
      DTL_ACCOUNTSPASSWORD: ${{ secrets.DTL_ACCOUNTSPASSWORD }}
      UNITTESTFILES_AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.UNITTESTFILES_AZURE_STORAGE_CONNECTION_STRING }}
      UNITTESTFILES_AZURE_STORAGE_SHARE_NAME: ${{ secrets.UNITTESTFILES_AZURE_STORAGE_SHARE_NAME }}
      GH_TOKEN_ADD_RUNNER: ${{ secrets.GH_TOKEN_ADD_RUNNER }}
