name: CI
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create a release'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "v*"
  pull_request:
    branches: [ "master" ]

jobs:
  call-ci-workflow:
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-ci.yml
    with:
      project_name: ${{ vars.PROJECT_NAME }}
      publish_release: ${{ inputs.publish_release || false }}
    secrets:
      base64_encoded_signingkey: ${{ secrets.BASE64_ENCODED_SIGNINGKEY }}
