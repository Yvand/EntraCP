name: CI
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create a release'
        type: boolean
        required: false
        default: false
      release_tag:
        description: 'Tag to create or reuse when publishing from a branch (e.g. v1.0.0.0)'
        type: string
        required: false
        default: ''
  push:
    tags:
      - "v*"
  pull_request:
    branches: [ "master" ]

jobs:
  call-ci-workflow:
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-ci.yml
    with:
      project_name: ${{ vars.PROJECT_NAME }}
      publish_release: ${{ inputs.publish_release || false }}
      release_tag: ${{ inputs.release_tag || '' }}
    secrets:
      base64_encoded_signingkey: ${{ secrets.BASE64_ENCODED_SIGNINGKEY }}
